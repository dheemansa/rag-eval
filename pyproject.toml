[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-eval"
version = "0.1.0"
description = "pytest for RAG – score any RAG pipeline on retrieval, faithfulness, citations, and correctness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
nli = [
    "torch>=2.0",
    "transformers>=4.30",
]
all = [
    "rag-eval[nli]",
]
dev = [
    "rag-eval[all]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
rag-eval = "rag_eval.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["rag_eval", "demo"]

[tool.hatch.build.targets.sdist]
include = ["rag_eval", "demo", "tests", "PLAN.md", "README.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
